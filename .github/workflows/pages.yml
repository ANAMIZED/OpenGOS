name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'opengrants-os-1.html'
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          # Prefer the full uploaded shell; fall back to demo/
          if [ -f opengrants-os-1.html ]; then
            cp opengrants-os-1.html _site/index.html
          elif [ -f demo/index.html ]; then
            cp demo/index.html _site/index.html
          else
            echo "No demo HTML found" && exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
