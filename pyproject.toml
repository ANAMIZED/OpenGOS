[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengos"
version = "0.3.0"
description = "OpenGOS — Autonomous Agentic AI MCP Server for grants discovery, ranking, drafting, and public-goods funding."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "OpenGOS Community", email = "opengos@example.com" }
]
keywords = [
    "mcp", "grants", "ai", "agentic", "open-source", "funding",
    "public-goods", "donations", "opengos",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ANAMIZED/OpenGOS"
Repository = "https://github.com/ANAMIZED/OpenGOS"
Issues = "https://github.com/ANAMIZED/OpenGOS/issues"

[project.scripts]
opengos = "opengrants.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opengrants"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
